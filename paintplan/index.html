<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PaintPlan">
<meta name="theme-color" content="#242424">
<meta name="paintplan-build" content="classic@ce6cfbf4209e">
<title>PaintPlan — plan &amp; practise paintings from a photo</title>
<style id="base">
/* styles/base.css — structure + component styles shared by every theme.
   Uses design tokens (CSS custom properties) that each theme defines in its theme.css (:root{…}).
   Themes override anything here; keep app-structure rules (positioning that JS relies on) in this file. */
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));border-bottom:1px solid var(--line);flex:none;overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
.brand{font-weight:600;letter-spacing:.02em;margin-right:4px;white-space:nowrap;color:var(--accent)}
.spacer{flex:1}
button,.btn{font:inherit;color:var(--text);background:var(--btn);border:1px solid #4a4a4a;border-radius:6px;padding:5px 10px;cursor:pointer;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center;justify-content:center;gap:4px;user-select:none;-webkit-user-select:none}
button:hover,.btn:hover{background:var(--btnh)}
button.on,button[aria-pressed=true]{background:#4a4538;border-color:var(--accent);color:#fff}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#body{flex:1;display:flex;min-height:0}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden}
#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
#panel{width:350px;flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
#modes{display:flex;gap:4px;padding:8px;flex:none;border-bottom:1px solid var(--line);flex-wrap:wrap;overflow-x:auto;scrollbar-width:none}
#modes::-webkit-scrollbar{display:none}
#modes button{padding:4px 9px;min-height:32px;font-size:13px}
#panelBody{flex:1;overflow-y:auto;padding:2px 10px 28px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sec{padding:8px 0 6px;border-bottom:1px solid var(--line)}
.sec h3{margin:2px 0 2px;font-size:15px}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:11px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';color:var(--muted);font-weight:400;font-size:18px;line-height:1}
details[open]>summary::after{content:'\2013'}
details>div{padding-bottom:10px}
.row{display:flex;align-items:center;gap:8px;margin:6px 0}
.row>label{flex:0 0 106px;color:var(--muted);font-size:13px}
.row input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px;margin:0}
.row output{flex:0 0 46px;text-align:right;font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted)}
select,input[type=number],input[type=text]{font:inherit;color:var(--text);background:var(--field);border:1px solid #4a4a4a;border-radius:6px;padding:4px 6px;min-height:32px;min-width:0}
input[type=number]{width:74px}
.row select{flex:1}
input[type=color]{width:44px;height:32px;border:1px solid #4a4a4a;border-radius:6px;background:var(--field);padding:2px;flex:none}
.ck{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;cursor:pointer}
.ck input{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:none}
.cks{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.hint{color:var(--muted);font-size:12.5px;margin:4px 0 6px}
.info{color:var(--muted);font-size:12.5px;background:#252525;border:1px solid var(--line);border-radius:6px;padding:7px 8px;line-height:1.55;margin:8px 0}
.info b{color:var(--text);font-weight:600}
.sub{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:12px 0 2px}
.strip{display:flex;gap:2px;margin:8px 0 4px}
.step{flex:1 1 0;flex-direction:column;padding:6px 1px;min-width:0;border-radius:4px;border:2px solid transparent;font-size:11px;line-height:1.25;gap:0;min-height:0}
.step b{font-size:13px}
.step small{font-size:10px;opacity:.85}
.step.sel,.sw.sel{border-color:var(--accent)!important}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(94px,1fr));gap:6px;margin:8px 0}
.sw{white-space:normal;flex-direction:column;align-items:stretch;justify-content:flex-start;padding:4px;gap:2px;font-size:11px;text-align:left;border:2px solid transparent;background:#262626;line-height:1.3;min-height:0}
.sw i{display:block;height:32px;border-radius:3px;border:1px solid rgba(255,255,255,.08)}
.sw.wide{grid-column:1/-1;flex-direction:row;align-items:center;gap:8px}
.sw.wide i{width:44px;flex:none}
.pig{display:flex;gap:6px;align-items:center;margin:5px 0}
.pig input[type=text]{flex:1}
.pig button{min-height:32px;padding:2px 9px}
canvas.hist{width:100%;height:56px;display:block;border-radius:4px;margin:4px 0}
#posbar{position:absolute;left:8px;right:8px;bottom:8px;background:rgba(34,34,34,.96);border:1px solid var(--accent);border-radius:8px;padding:6px 8px;display:flex;flex-direction:column;gap:2px}
#posbar .pb-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#posbar .pb-row>label{flex:0 0 52px;color:var(--muted);font-size:13px}
#posbar input[type=range]{flex:1;min-width:0;accent-color:var(--accent);height:28px;margin:0}
#posbar output{flex:0 0 52px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#posbar .pb-title{font-weight:600;color:var(--accent)}
#posbar .hint{margin:0;flex:1 1 180px}
#posbar .pb-btns button{padding:4px 9px;min-height:32px}
#pick{position:absolute;left:8px;top:8px;width:min(330px,calc(100% - 16px));background:rgba(36,36,36,.96);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12.5px;display:flex;gap:9px;line-height:1.45}
#pick .pk-sw{flex:none;width:62px;background:#777;border-radius:4px;padding:8px;display:flex;flex-direction:column;gap:6px}
#pick .pk-sw i{display:block;height:38px;border-radius:2px}
#pick .pk-x{position:absolute;right:4px;top:4px;min-height:26px;padding:0 8px;background:transparent;border-color:transparent}
#pick .pk-t{flex:1;min-width:0;padding-right:18px}
#pick b{color:#fff}
#status{position:absolute;right:8px;top:8px;font-size:12px;color:var(--muted);background:rgba(0,0,0,.45);padding:2px 7px;border-radius:4px;pointer-events:none}
#drop{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);font-size:18px;border:2px dashed var(--accent);pointer-events:none}
body.dragging #drop{display:flex}
body.nopanel #panel{display:none}
kbd{font:11px ui-monospace,monospace;background:#1d1d1d;border:1px solid #444;border-radius:3px;padding:0 3px}
@media (max-width:760px){
  #body{flex-direction:column}
  #panel{width:auto;border-left:0;border-top:1px solid var(--line);height:47%;flex:none;padding-bottom:env(safe-area-inset-bottom)}
  #modes{flex-wrap:nowrap}
  body.nopanel #panel{display:flex;height:auto}
  body.nopanel #panelBody{display:none}
  .row>label{flex-basis:96px}
  header button,header .btn{padding:4px 7px;font-size:13px}
  header{gap:4px}
  .hide-m{display:none}
  body.positioning #panelBody{display:none}
  body.positioning #panel{height:auto}
  #posbar .hint{display:none}
}
#printArea{display:none}
@media print{#app{display:none!important}#printArea{display:block}#printArea img{width:100%;height:auto}@page{margin:10mm}}
[hidden]{display:none!important}
/* PWA / iPhone safe areas */
header{padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right))}
#panel{padding-right:env(safe-area-inset-right);padding-bottom:env(safe-area-inset-bottom)}
#stage{margin-left:env(safe-area-inset-left)}
@media (max-width:760px){#stage{margin-left:0;margin-right:0}#panelBody{padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right))}}
/* Empty state overlay (themes without the sample provide #empty) */
#empty{display:none}
/* "Updated — reload" toast (ui/pwa.js) */
#toast{position:fixed;z-index:50;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:6px 6px 6px 14px;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.35);font-size:13.5px;max-width:calc(100% - 24px)}
#toast button{min-height:30px;padding:3px 12px}
#toast #toastX{background:transparent;border-color:transparent;padding:3px 8px}
</style>
<style id="theme-classic">
/* themes/classic/theme.css — the original PaintPlan look: warm dark grey, sand accent. Design tokens only;
   all component styles come from styles/base.css. */
:root{--bg:#242424;--panel:#2c2c2c;--line:#3b3b3b;--text:#e7e5e1;--muted:#a7a49e;--accent:#c8b48f;--btn:#363636;--btnh:#414141;--field:#1f1f1f}
</style>
</head>
<body>
<div id="app">
<header>
  <span class="brand hide-m">PaintPlan</span>
  <label class="btn" title="Open a photo (or drop / paste one)">Open<input type="file" id="file" accept="image/*" hidden></label>
  <button id="bSample" title="Load the built-in sample">Sample</button>
  <button id="bPos" title="Position the image behind the canvas (P)">Position</button>
  <button id="bMirror" aria-pressed="false" title="Mirror view (M)">Mirror</button>
  <button id="bFit" class="hide-m" title="Reset zoom (double-tap also works)">Fit</button>
  <span class="spacer"></span>
  <button id="bPng" title="Download current view as PNG">PNG</button>
  <button id="bPanel" title="Show / hide controls">Panel</button>
</header>
<div id="body">
  <div id="stage">
    <canvas id="view" aria-label="Reference view"></canvas>
    <div id="drop">Drop the photo here</div>
    <div id="status" hidden></div>
    <div id="pick" hidden></div>
    <div id="posbar" hidden>
      <div class="pb-row"><span class="pb-title">Position image</span><span class="hint">Drag to move · pinch to scale &amp; rotate · scroll to scale (Shift+scroll rotates)</span></div>
      <div class="pb-row"><label for="posScale">Scale</label><input type="range" id="posScale" min="-2" max="4" step="0.005"><output id="oPosScale"></output></div>
      <div class="pb-row"><label for="posRot">Rotate</label><input type="range" id="posRot" min="-45" max="45" step="0.1"><output id="oPosRot"></output></div>
      <div class="pb-row pb-btns"><button id="pFill" title="Scale so the image covers the whole canvas">Fill</button><button id="pFit" title="Show the whole image inside the canvas">Fit</button><button id="pCenter">Centre</button><button id="pRotL" title="Rotate 90° left">&#x27F2; 90°</button><button id="pRotR" title="Rotate 90° right">&#x27F3; 90°</button><button id="pFlipH" title="Flip left/right">Flip &#x2194;</button><button id="pFlipV" title="Flip up/down">Flip &#x2195;</button><span class="spacer"></span><button id="pDone" class="on">Done</button></div>
    </div>
  </div>
  <aside id="panel">
    <nav id="modes" aria-label="View mode"></nav>
    <div id="panelBody"></div>
  </aside>
</div>
</div>
<div id="printArea"><img id="printImg" alt="Grid reference"></div>

    cols.forEach((cl,i)=>{x.fillStyle=hex2(cl.rgb);x.fillRect(M+i*sw,y,sw-6,90);x.fillStyle='#222';x.fillText(hex2(cl.rgb),M+i*sw,y+116);x.fillText(`V ${Math.round(cl.L)}% · ${Math.round(cl.pct*100)}%`,M+i*sw,y+140);});}
  return c;
}
function exportSheet(){if(origData)download(sheetCanvas(),`paintplan-grid-${fmtN(S.cw)}x${fmtN(S.ch)}${S.unit}.png`);}
function printSheet(){if(!origData)return;const img=$('#printImg');img.onload=()=>{setTimeout(()=>window.print(),50);img.onload=null;};img.src=sheetCanvas().toDataURL('image/png');}
/* ui/init.js — Wiring: DOM events -> actions; init(). */
/* ---------- wiring ---------- */
function init(){
  buildPanel();syncControls();
  const pb=$('#panelBody');
  pb.addEventListener('input',e=>{if(e.target.dataset.pi!==undefined)onPig(e);else if(e.target.type!=='number'||e.target.value!=='')onControl(e);});
  pb.addEventListener('change',e=>{if(e.target.dataset.pi!==undefined)return;if(e.target.tagName==='SELECT'||e.target.type==='checkbox'||e.target.type==='number')onControl(e);});
  pb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.hl!==undefined)setHL(+b.dataset.hl);
    else if(b.dataset.del!==undefined){if(S.pigments.length>1){S.pigments=S.pigments.filter((_,i)=>i!=b.dataset.del);S.rPreset='custom';syncControls();save();update();}}
    else if(b.id==='bAddPig'){if(S.pigments.length<12){S.pigments=S.pigments.concat([{n:'New paint',c:'#808080'}]);S.rPreset='custom';syncControls();save();update();}}
    else if(b.id==='bUsePal'){if(lastPalette){S.rPreset='extracted';applyPigPreset();setState('mode','remap');}}
    else if(b.id==='bCopyHex'){if(lastPalette){const t=lastPalette.cols.map(c=>hex2(c.rgb)).join(' ');(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>{b.textContent='Copied';setTimeout(()=>b.textContent='Copy hex list',1500);},()=>prompt('Hex colours:',t));}}
    else if(b.id==='bPos2')setPosMode(true);else if(b.id==='bClearImg')clearSaved();
    else if(b.id==='bPng2')exportPNG();else if(b.id==='bSheet')exportSheet();else if(b.id==='bPrint')printSheet();
  });
  $('#modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(b)setState('mode',b.dataset.mode);});
  $('#file').addEventListener('change',e=>{loadFile(e.target.files[0]);e.target.value='';});
  if($('#bSample'))$('#bSample').onclick=loadSample;
  $('#bPos').onclick=()=>setPosMode(!posMode);
  document.getElementById('panelBody').addEventListener('change',e=>{if(e.target.id==='file2'){loadFile(e.target.files[0]);e.target.value='';}});
  $('#bMirror').onclick=()=>setState('flipH',!S.flipH);
  $('#bFit').onclick=resetView;
  $('#bPng').onclick=exportPNG;
  $('#bPanel').onclick=()=>{document.body.classList.toggle('nopanel');resize();};
  $('#posScale').addEventListener('input',e=>{const P=S.place;P.s=placeScale('fit')*Math.pow(2,+e.target.value);P.auto=false;clampScale();placeChanged(false);});
  $('#posRot').addEventListener('input',e=>{const P=S.place;P.rot=normRot(90*Math.round(P.rot/90)+(+e.target.value));if(P.auto)applyAuto();placeChanged(false);});
  $('#posRot').addEventListener('dblclick',()=>{const P=S.place;P.rot=normRot(90*Math.round(P.rot/90));if(P.auto)applyAuto();placeChanged(true);});
  $('#pFill').onclick=()=>snapPlace('fill');$('#pFit').onclick=()=>snapPlace('fit');
  $('#pCenter').onclick=()=>{S.place.cx=0.5;S.place.cy=0.5;placeChanged(true);};
  $('#pRotL').onclick=()=>rotatePlace(-90);$('#pRotR').onclick=()=>rotatePlace(90);
  $('#pFlipH').onclick=()=>flipPlace('h');$('#pFlipV').onclick=()=>flipPlace('v');
  $('#pDone').onclick=()=>setPosMode(false);
  $('#pick').addEventListener('click',e=>{if(e.target.closest('.pk-x'))closePick();});
  ['dragenter','dragover'].forEach(t=>window.addEventListener(t,e=>{if(e.dataTransfer&&[...e.dataTransfer.types].includes('Files')){e.preventDefault();document.body.classList.add('dragging');}}));
  window.addEventListener('dragleave',e=>{if(!e.relatedTarget)document.body.classList.remove('dragging');});
  window.addEventListener('drop',e=>{e.preventDefault();document.body.classList.remove('dragging');const f=e.dataTransfer&&e.dataTransfer.files[0];if(f)loadFile(f);});
  window.addEventListener('paste',e=>{const it=[...(e.clipboardData||{}).items||[]].find(i=>i.type.startsWith('image/'));if(it)loadFile(it.getAsFile());});
  window.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
    if(posMode&&src){const P=S.place,st=e.shiftKey?0.05:0.005;let hit=true;
      if(e.key==='ArrowLeft')P.cx-=st;else if(e.key==='ArrowRight')P.cx+=st;else if(e.key==='ArrowUp')P.cy-=st;else if(e.key==='ArrowDown')P.cy+=st;
      else if(e.key==='+'||e.key==='=')P.s*=1.03;else if(e.key==='-')P.s/=1.03;else if(e.key==='[')P.rot=normRot(P.rot-0.5);else if(e.key===']')P.rot=normRot(P.rot+0.5);
      else if(e.key==='Escape'||e.key==='Enter'||e.key==='p'||e.key==='P'){setPosMode(false);return;}else hit=false;
      if(hit){e.preventDefault();P.auto=false;clampScale();placeChanged(false);return;}}
    if(e.key==='m'||e.key==='M')setState('flipH',!S.flipH);else if(e.key==='p'||e.key==='P')setPosMode(true);else if(e.key==='0')resetView();else if(/^[1-9]$/.test(e.key))setState('mode',MODES[+e.key-1][0]);else if(e.key==='Escape')closePick();});
  if(window.matchMedia('(max-width:760px)').matches){$('#dComp').open=false;}
  new ResizeObserver(resize).observe(cv);resize();
  initWorker();
  restoreImage();
  HOOKS.forEach(f=>f());
}
/* ui/pwa.js — Service worker registration + "Updated — reload" toast.
   THEME.build is the content hash stamped by build.mjs; sw.js knows the same hash. When a new service worker
   takes control and reports a different build than this page, a small toast offers a reload. */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  const SWC=navigator.serviceWorker,hadCtl=!!SWC.controller;let reg=null,lastCheck=Date.now();
  const swBuild=sw=>new Promise(res=>{try{const ch=new MessageChannel();ch.port1.onmessage=e=>res(e.data&&e.data.build);sw.postMessage({type:'build'},[ch.port2]);setTimeout(()=>res(null),3000);}catch(e){res(null);}});
  function updToast(){
    if(document.getElementById('toast'))return;
    const t=document.createElement('div');t.id='toast';t.setAttribute('role','status');
    t.innerHTML='<span>PaintPlan was updated.</span><button id="toastReload" class="on">Reload</button><button id="toastX" aria-label="Dismiss">\u00d7</button>';
    document.body.appendChild(t);
    t.addEventListener('click',e=>{if(e.target.id==='toastReload')location.reload();else if(e.target.id==='toastX')t.remove();});
  }
  SWC.addEventListener('controllerchange',async()=>{if(!hadCtl||!SWC.controller)return;const b=await swBuild(SWC.controller);if(b&&b!==THEME.build)updToast();});
  addEventListener('load',()=>{SWC.register('sw.js').then(r=>{reg=r;}).catch(e=>console.warn('SW registration failed',e));});
  // installed iPhone apps can stay open for days: look for a new version when the app comes back to the foreground
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&reg&&Date.now()-lastCheck>60000){lastCheck=Date.now();reg.update().catch(()=>{});}});
}
/* ui/boot.js — start the app (must be the last module). */
init();
</script>
